# Configuração Oficial do Fly.io para o PriceTracker Discord Bot
# Otimizado para WebSocket contínuo 24/7 sem portas HTTP públicas e com volume persistente

app = "baggy-pricetracker"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  DB_PATH = "/data/bot_database.db"

[mounts]
  source = "data_volume"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
